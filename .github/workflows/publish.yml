name: Publish to PyPI

# Runs only when a GitHub release is published. Uses PyPI Trusted Publishing:
# no API token or password is stored anywhere.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the web UI into the Python package
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check the wheel contains the web UI
        run: |
          python -c "import glob, zipfile, sys; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'devpilot_ui/static/index.html' in names else 'The wheel is missing the built web UI')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/devpilot-mcp/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
