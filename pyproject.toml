[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot-mcp"
version = "0.1.1"
description = "An MCP server that gives AI models structured, security-conscious access to a software repository, including controlled patching and test execution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaustubh Dwivedi" }]
keywords = ["mcp", "model-context-protocol", "ai", "developer-tools", "code-search", "git", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.2,<3",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/KD-kaustubh/devpilot-mcp"
Documentation = "https://github.com/KD-kaustubh/devpilot-mcp/blob/main/docs/USAGE.md"
Source = "https://github.com/KD-kaustubh/devpilot-mcp"
Issues = "https://github.com/KD-kaustubh/devpilot-mcp/issues"

[project.scripts]
devpilot-mcp = "devpilot_mcp.server:main"

[tool.setuptools.packages.find]
include = ["devpilot_mcp*"]
